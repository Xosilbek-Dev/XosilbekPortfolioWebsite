<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <!-- Main gradient: ko'k → binafsha → pushti -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="50%"  stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>

    <!-- X icon gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- ── Background capsule (optional, dark) ── -->
  <!-- <rect x="0" y="0" width="280" height="80" rx="16" fill="#0a0e1a"/> -->

  <!-- ── X icon box ── -->
  <rect x="4" y="10" width="58" height="58" rx="14" fill="url(#iconGrad)" opacity="0.12"/>
  <rect x="4" y="10" width="58" height="58" rx="14" fill="none" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- X letter inside box -->
  <text
    x="33"
    y="50"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Segoe UI', 'Inter', 'SF Pro Display', sans-serif"
    font-size="30"
    font-weight="900"
    fill="url(#mainGrad)"
    filter="url(#glow)"
  >X</text>

  <!-- ── Main name: Xosilbek ── -->
  <text
    x="78"
    y="35"
    font-family="'Segoe UI', 'Inter', 'SF Pro Display', sans-serif"
    font-size="26"
    font-weight="800"
    letter-spacing="0.5"
    fill="url(#mainGrad)"
    filter="url(#shadow)"
  >Xosilbek</text>

  <!-- ── Subtitle: Frontend Developer ── -->
  <text
    x="79"
    y="56"
    font-family="'Segoe UI', 'Inter', 'SF Pro Display', sans-serif"
    font-size="11"
    font-weight="500"
    letter-spacing="2.5"
    fill="#64748b"
  >FRONTEND DEVELOPER</text>

  <!-- ── Accent dot after name ── -->
  <circle cx="261" cy="28" r="4" fill="#F472B6" opacity="0.9" filter="url(#glow)"/>

  <!-- ── Bottom gradient line ── -->
  <line x1="78" y1="63" x2="268" y2="63" stroke="url(#mainGrad)" stroke-width="1" opacity="0.3"/>

</svg>
